services:
  raffle:
    image: ghcr.io/cyberfly100/goraffle:latest
    ports:
      - "${RAFFLE_PORT:-8543}:8543"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-raffle}?sslmode=disable
      - LISTEN_ADDR=:8543
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raffle}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
    volumes:
      # Point PGDATA_DIR at a NAS dataset (e.g. /mnt/tank/apps/goraffle/pgdata)
      # so DB files live where your NAS snapshots/backups cover them.
      # Unset = plain Docker volume.
      - ${PGDATA_DIR:-pgdata}:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d raffle"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
