{{define "partial:result"}}
<section id="result" class="card result" role="status">
  <div class="result-main">
    {{if .LastPick}}
    <span class="result-label">The winner is</span>
    <div class="reel">
      <div class="reel-track">
        <div class="reel-cell is-winner">{{.LastPick.EntryName}}</div>
      </div>
      <div class="reel-frame" aria-hidden="true"></div>
    </div>
    <span class="result-sub">pick #{{.LastPick.PickNumber}}</span>
    {{else}}
    <span class="result-label"></span>
    <div class="reel">
      <div class="reel-track">
        <div class="reel-cell is-idle">Welcome to the draw!</div>
      </div>
      <div class="reel-frame" aria-hidden="true"></div>
    </div>
    <span class="result-sub"></span>
    {{end}}
  </div>
  <div class="result-actions">
    <button id="draw-btn" class="btn btn-primary btn-lg">Draw</button>
    <button id="history-toggle-btn" class="btn btn-small">Show history</button>
  </div>
</section>
{{end}}
